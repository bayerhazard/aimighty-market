# Per-workload replica counts (key matches Deployment metadata.name and
# workloadReplicas in OlaresManifest).
workloads:
  aimpaddleocr:
    replicaCount: 1

frontend:
  image: docker.io/beclab/bleachzou-paddleocr-frontend:0.0.2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi

engine:
  gpuMemory: 8Gi
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "619m"
      memory: 4Gi