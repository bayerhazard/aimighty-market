    port: 8787
    host: hermeswebui
    title: Hermes WebUI
    authLevel: internal
    invisible: false
    openMethod: window

permission: {}

envs: []

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
    - name: hermesagent
      version: '>=1.0.0'
      type: application
